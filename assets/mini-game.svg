<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Gate Runner</title>
  <desc id="desc">A tiny monochrome arcade scene: a little craft weaves between moving energy gates.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#08090b"/>
      <stop offset=".55" stop-color="#101216"/>
      <stop offset="1" stop-color="#070809"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#cfd7e3" stop-opacity=".10"/>
      <stop offset=".5" stop-color="#e7ebf2" stop-opacity=".55"/>
      <stop offset="1" stop-color="#cfd7e3" stop-opacity=".10"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#e7ebf2" stop-opacity="0"/>
      <stop offset="1" stop-color="#e7ebf2" stop-opacity=".65"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#cbd5e1" stop-opacity=".15"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#dfe5ef" stroke-opacity=".045" stroke-width=".7"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="220" rx="12"/></clipPath>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .gridline{fill:none;stroke:#dfe5ef;stroke-opacity:.10;stroke-width:.8}
      .gate-edge{fill:none;stroke:#e2e7f0;stroke-opacity:.34;stroke-width:1}
      .gate-bar{fill:url(#gate)}
      .star{fill:#e7edf5;animation:blink var(--dur,3s) ease-in-out var(--delay,0s) infinite}
      .streak{stroke:url(#trail);stroke-width:1;stroke-linecap:round;animation:streak 3.6s linear infinite}
      .craft-glow{animation:pulse 1.8s ease-in-out infinite}
      .hud-dot{fill:#dfe5ef;opacity:.28}
      @keyframes blink{0%,100%{opacity:.14}50%{opacity:.8}}
      @keyframes streak{from{transform:translateX(180px);opacity:0}20%{opacity:.5}to{transform:translateX(-380px);opacity:0}}
      @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.8}}
      @media(prefers-reduced-motion:reduce){
        .star,.streak,.craft-glow{animation:none!important}
        .star{opacity:.35}.streak{opacity:.2}
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="url(#back)"/>
    <rect width="1200" height="220" fill="url(#grid)"/>
    <ellipse cx="245" cy="112" rx="170" ry="105" fill="url(#aura)"/>
    <path d="M0 36H1200M0 184H1200" class="gridline"/>
    <path d="M0 110H1200" stroke="#dfe5ef" stroke-opacity=".035" stroke-dasharray="2 10"/>

    <g opacity=".75">
      <path class="streak" d="M0 57h55" style="animation-delay:-.8s"/>
      <path class="streak" d="M0 78h32" style="animation-delay:-2.1s"/>
      <path class="streak" d="M0 151h44" style="animation-delay:-1.4s"/>
      <path class="streak" d="M0 169h24" style="animation-delay:-.4s"/>
      <circle class="star" cx="90" cy="64" r="1.3" style="--dur:2.8s"/>
      <circle class="star" cx="157" cy="157" r="1.7" style="--dur:3.7s;--delay:-1.2s"/>
      <circle class="star" cx="420" cy="52" r="1.2" style="--dur:4.1s;--delay:-2.2s"/>
      <circle class="star" cx="466" cy="175" r="1.5" style="--dur:2.3s;--delay:-.7s"/>
      <circle class="star" cx="702" cy="51" r="1.2" style="--dur:3.3s;--delay:-1.4s"/>
      <circle class="star" cx="940" cy="172" r="1.4" style="--dur:4s;--delay:-2.1s"/>
      <circle class="star" cx="1110" cy="62" r="1.7" style="--dur:2.5s;--delay:-.6s"/>
    </g>

    <g id="gates">
      <g transform="translate(780 0)">
        <rect class="gate-bar" x="-7" y="34" width="14" height="29" rx="3"/>
        <rect class="gate-bar" x="-7" y="107" width="14" height="77" rx="3"/>
        <path class="gate-edge" d="M-13 34h26M-13 184h26M-11 70h22M-11 101h22"/>
        <path d="M0 64v7M0 100v7" stroke="#f1f4f8" stroke-opacity=".7"/>
      </g>
      <g transform="translate(1035 0)">
        <rect class="gate-bar" x="-7" y="34" width="14" height="94" rx="3"/>
        <rect class="gate-bar" x="-7" y="172" width="14" height="12" rx="3"/>
        <path class="gate-edge" d="M-13 34h26M-13 184h26M-11 135h22M-11 165h22"/>
        <path d="M0 128v7M0 165v7" stroke="#f1f4f8" stroke-opacity=".7"/>
      </g>
      <g transform="translate(1290 0)">
        <rect class="gate-bar" x="-7" y="34" width="14" height="42" rx="3"/>
        <rect class="gate-bar" x="-7" y="120" width="14" height="64" rx="3"/>
        <path class="gate-edge" d="M-13 34h26M-13 184h26M-11 83h22M-11 114h22"/>
        <path d="M0 77v6M0 114v6" stroke="#f1f4f8" stroke-opacity=".7"/>
      </g>
      <g transform="translate(1545 0)">
        <rect class="gate-bar" x="-7" y="34" width="14" height="92" rx="3"/>
        <rect class="gate-bar" x="-7" y="174" width="14" height="10" rx="3"/>
        <path class="gate-edge" d="M-13 34h26M-13 184h26M-11 133h22M-11 167h22"/>
        <path d="M0 126v7M0 167v7" stroke="#f1f4f8" stroke-opacity=".7"/>
      </g>
      <animateTransform attributeName="transform" type="translate" values="0 0;-1700 0" dur="10s" repeatCount="indefinite" calcMode="linear"/>
    </g>

    <g transform="translate(245 0)">
      <g id="craft">
        <animateTransform attributeName="transform" type="translate"
          values="0 130;0 130;0 85;0 85;0 150;0 150;0 98;0 98;0 150;0 150;0 130"
          keyTimes="0;.20;.306;.36;.456;.51;.606;.66;.756;.82;1"
          dur="10s" repeatCount="indefinite" calcMode="linear"/>
        <ellipse class="craft-glow" cx="-1" cy="0" rx="28" ry="20" fill="url(#aura)"/>
        <path d="M-35 0h18" stroke="url(#trail)" stroke-width="2" stroke-linecap="round"/>
        <path d="M-23 -4l-11 -5M-23 4l-11 5" fill="none" stroke="#dfe5ef" stroke-opacity=".35"/>
        <path d="M-11 -8L13 0 -11 8 -5 0Z" fill="#e7edf5" fill-opacity=".10" stroke="#f0f3f8" stroke-width="1.2"/>
        <path d="M-5 -3L5 0 -5 3Z" fill="#f4f6fa" filter="url(#glow)"/>
        <circle cx="-13" cy="0" r="2.2" fill="#f2f5f9" class="craft-glow"/>
      </g>
    </g>

    <g transform="translate(26 18)">
      <rect width="1148" height="184" rx="8" fill="none" stroke="#dfe5ef" stroke-opacity=".13"/>
      <path d="M16 0v8M1132 0v8M16 176v8M1132 176v8" stroke="#dfe5ef" stroke-opacity=".3"/>
      <g transform="translate(18 18)">
        <circle class="hud-dot" cx="0" cy="0" r="2.2"/>
        <circle class="hud-dot" cx="9" cy="0" r="2.2"/>
        <circle class="hud-dot" cx="18" cy="0" r="2.2"/>
      </g>
      <g transform="translate(1008 17)">
        <rect width="82" height="3" rx="1.5" fill="#dfe5ef" fill-opacity=".08"/>
        <rect width="82" height="3" rx="1.5" fill="#dfe5ef" fill-opacity=".42">
          <animate attributeName="width" values="12;82;12" dur="10s" repeatCount="indefinite"/>
        </rect>
      </g>
    </g>
  </g>
</svg>
