<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Module Bench</title>
  <desc id="desc">A warm-toned technical workbench with floating isometric modules that assemble into a connected structure, with a small moving marker tracing the route between modules.</desc>
  <defs>
    <pattern id="bench-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#F5F3EB" stroke-opacity=".08" stroke-width=".7"/>
    </pattern>
    <linearGradient id="bench-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#173A32"/><stop offset="1" stop-color="#102B26"/>
    </linearGradient>
    <g id="iso-cube" stroke-linejoin="round" stroke-width="1.2">
      <path d="M0 0L24 -14L48 0L24 14Z" fill="#F5F3EB" stroke="#9DB9A9"/>
      <path d="M0 0L24 14V42L0 28Z" fill="#C5D5C7" stroke="#9DB9A9"/>
      <path d="M24 14L48 0V28L24 42Z" fill="#819D8E" stroke="#9DB9A9"/>
    </g>
  </defs>
  <rect width="1200" height="220" rx="14" fill="url(#bench-bg)"/>
  <rect width="1200" height="220" rx="14" fill="url(#bench-grid)"/>
  <text x="38" y="35" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.2" fill="#D4E1D5" opacity=".72">MODULE BENCH / STUDY 03</text>
  <text x="38" y="80" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="28" font-weight="520" letter-spacing="-.65" fill="#F5F3EB">Parts become a system.</text>
  <text x="40" y="105" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="13" fill="#C3D3C6" opacity=".83">Structure is built one connection at a time.</text>
  <path d="M40 135H260" stroke="#C3D3C6" stroke-opacity=".32"/>
  <text x="40" y="158" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#C3D3C6" opacity=".7">CONNECT / CHECK / REPEAT</text>
  <g transform="translate(390 66)">
    <path d="M20 70L150 25L280 70L410 25L540 70" fill="none" stroke="#91B6A3" stroke-opacity=".52" stroke-width="1.5" stroke-dasharray="4 7"/>
    <path d="M20 70L150 25L280 70L410 25L540 70" fill="none" stroke="#E16E50" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 700">
      <animate attributeName="stroke-dasharray" values="1 700;84 700;1 700" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="stroke-dashoffset" values="0;-700" dur="3.8s" repeatCount="indefinite"/>
    </path>
    <g transform="translate(0 0)">
      <use href="#iso-cube" x="0" y="52"/>
      <use href="#iso-cube" x="0" y="22" opacity=".88"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -3;0 0" dur="3.2s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(135 -30)">
      <use href="#iso-cube" x="0" y="52"/>
      <use href="#iso-cube" x="24" y="24" opacity=".72"/>
      <animateTransform attributeName="transform" type="translate" values="135 -30;135 -34;135 -30" dur="3.7s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(270 0)">
      <use href="#iso-cube" x="0" y="52"/>
      <use href="#iso-cube" x="24" y="24" opacity=".8"/>
      <animateTransform attributeName="transform" type="translate" values="270 0;270 -3;270 0" dur="3.4s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(405 -30)">
      <use href="#iso-cube" x="0" y="52"/>
      <use href="#iso-cube" x="0" y="22" opacity=".88"/>
      <animateTransform attributeName="transform" type="translate" values="405 -30;405 -34;405 -30" dur="4s" repeatCount="indefinite"/>
    </g>
    <circle cx="20" cy="122" r="3.5" fill="#E16E50">
      <animate attributeName="opacity" values=".6;1;.6" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="122" r="3.5" fill="#E16E50">
      <animate attributeName="opacity" values=".6;1;.6" dur="1.2s" begin=".6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M385 198H1148" stroke="#C3D3C6" stroke-opacity=".16"/>
  <text x="1148" y="187" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.5" fill="#C3D3C6" opacity=".55">ASSEMBLY / 03</text>
</svg>