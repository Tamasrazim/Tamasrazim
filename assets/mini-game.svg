<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Velocity Run</title>
  <desc id="desc">A seamless perspective tunnel with fast rushing grid lines and a futuristic craft. Every animation returns to the same visual phase every 2.4 seconds.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#07080a"/>
      <stop offset=".58" stop-color="#101319"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#11151b" stop-opacity=".12"/>
      <stop offset="1" stop-color="#687386" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dbe3ef" stop-opacity="0"/>
      <stop offset=".5" stop-color="#f1f4f8" stop-opacity=".8"/>
      <stop offset="1" stop-color="#dbe3ef" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#dbe3ef" stop-opacity=".12"/>
      <stop offset=".5" stop-color="#edf1f7" stop-opacity=".62"/>
      <stop offset="1" stop-color="#dbe3ef" stop-opacity=".15"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#d5deec" stop-opacity=".25"/>
      <stop offset=".5" stop-color="#98a6bb" stop-opacity=".08"/>
      <stop offset="1" stop-color="#98a6bb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="microgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#dfe5ef" stroke-opacity=".035" stroke-width=".7"/>
    </pattern>
    <clipPath id="clip"><rect width="1200" height="260" rx="12"/></clipPath>
    <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      /* Seamless master cycle: 2.4 seconds. All sub-loops divide this cycle. */
      .rail{fill:none;stroke:#d9e1ec;stroke-opacity:.22;stroke-width:1}
      .thinrail{fill:none;stroke:#cdd7e5;stroke-opacity:.10;stroke-width:.8}
      .dashrail{fill:none;stroke:#dfe6f0;stroke-opacity:.34;stroke-width:1;stroke-dasharray:4 16;animation:dashflow .8s linear infinite}
      .speedline{fill:none;stroke:url(#beam);stroke-width:1.1;stroke-linecap:round;stroke-dasharray:3 38;animation:dashflow .8s linear infinite}
      .frame{fill:none;stroke:url(#frameStroke);stroke-width:1.25;transform-box:fill-box;transform-origin:center;animation:approach 1.2s linear infinite}
      .frame-2{animation-delay:-.24s}
      .frame-3{animation-delay:-.48s}
      .frame-4{animation-delay:-.72s}
      .frame-5{animation-delay:-.96s}
      .rung{fill:none;stroke:#dce4ef;stroke-opacity:.32;stroke-width:1;transform-box:fill-box;transform-origin:center;animation:rush 1.2s linear infinite}
      .rung:nth-of-type(2){animation-delay:-.15s}
      .rung:nth-of-type(3){animation-delay:-.30s}
      .rung:nth-of-type(4){animation-delay:-.45s}
      .rung:nth-of-type(5){animation-delay:-.60s}
      .rung:nth-of-type(6){animation-delay:-.75s}
      .rung:nth-of-type(7){animation-delay:-.90s}
      .rung:nth-of-type(8){animation-delay:-1.05s}
      .spark{fill:#f0f4fa;animation:spark 1.2s ease-in-out infinite}
      .ship-glow{animation:engine 1.2s ease-in-out infinite}
      .ship{transform-box:fill-box;transform-origin:center;animation:bank 2.4s ease-in-out infinite}
      .hud{fill:none;stroke:#dfe6f0;stroke-opacity:.2;stroke-width:.8}
      @keyframes dashflow{to{stroke-dashoffset:-820}}
      @keyframes approach{
        0%{transform:scale(.035);opacity:0}
        10%{opacity:.38}
        68%{opacity:.27}
        100%{transform:scale(3.2);opacity:0}
      }
      @keyframes rush{
        0%{transform:translateY(-8px) scaleX(.04);opacity:0}
        12%{opacity:.26}
        100%{transform:translateY(128px) scaleX(7.5);opacity:0}
      }
      @keyframes spark{0%,100%{opacity:.16}50%{opacity:.84}}
      @keyframes engine{0%,100%{opacity:.22}50%{opacity:.84}}
      @keyframes bank{0%,100%{transform:translateX(0) rotate(0deg)}25%{transform:translateX(7px) rotate(2deg)}75%{transform:translateX(-7px) rotate(-2deg)}}
      @media(prefers-reduced-motion:reduce){
        .dashrail,.speedline,.frame,.rung,.spark,.ship-glow,.ship{animation:none!important}
        .frame{opacity:.15}
        .rung{opacity:.12;transform:none}
        .dashrail,.speedline{stroke-dasharray:none;opacity:.16}
      }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <rect width="1200" height="260" fill="url(#microgrid)"/>
    <ellipse cx="600" cy="108" rx="410" ry="170" fill="url(#glow)"/>

    <!-- The tunnel's converging planes create depth; moving highlights imply forward speed. -->
    <path d="M600 96L-30 260H1230Z" fill="url(#floor)"/>
    <path class="rail" d="M600 96L-30 260M600 96L1230 260"/>
    <path class="thinrail" d="M600 96L90 260M600 96L1110 260"/>
    <path class="thinrail" d="M600 96L230 260M600 96L970 260"/>
    <path class="thinrail" d="M600 96L390 260M600 96L810 260"/>
    <path class="thinrail" d="M600 96L510 260M600 96L690 260"/>
    <path class="dashrail" d="M600 96L-30 260M600 96L1230 260"/>
    <path class="speedline" d="M600 96L80 260M600 96L1120 260" style="animation-delay:-.22s"/>
    <path class="speedline" d="M600 96L310 260M600 96L890 260" style="animation-delay:-.44s"/>
    <path class="speedline" d="M600 96L470 260M600 96L730 260" style="animation-delay:-.11s"/>

    <!-- Repeated expanding frames cycle while fading out at each edge. -->
    <rect class="frame frame-2" x="500" y="70" width="200" height="52" rx="9"/>
    <rect class="frame frame-3" x="500" y="70" width="200" height="52" rx="9"/>
    <rect class="frame frame-4" x="500" y="70" width="200" height="52" rx="9"/>
    <rect class="frame frame-5" x="500" y="70" width="200" height="52" rx="9"/>
    <rect class="frame" x="500" y="70" width="200" height="52" rx="9"/>

    <!-- Crossbars rush from the horizon towards the viewer in staggered phases. -->
    <g>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
      <path class="rung" d="M590 98H610"/>
    </g>

    <!-- Perspective side gates, with alternating gaps like a fast arcade course. -->
    <g class="gatefield">
      <path d="M90 65H165V90H110V115H185V143H135V171H215V198H155V220"
        fill="none" stroke="#e1e8f2" stroke-opacity=".2" stroke-width="1.2"/>
      <path d="M1110 65H1035V90H1090V115H1015V143H1065V171H985V198H1045V220"
        fill="none" stroke="#e1e8f2" stroke-opacity=".2" stroke-width="1.2"/>
      <path d="M90 65H165V90H110V115H185V143H135V171H215V198H155V220"
        fill="none" stroke="url(#beam)" stroke-width="2" stroke-dasharray="32 240">
        <animate attributeName="stroke-dashoffset" values="0;-272" dur=".8s" repeatCount="indefinite"/>
      </path>
      <path d="M1110 65H1035V90H1090V115H1015V143H1065V171H985V198H1045V220"
        fill="none" stroke="url(#beam)" stroke-width="2" stroke-dasharray="32 240">
        <animate attributeName="stroke-dashoffset" values="0;272" dur=".82s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Small craft: mostly still, gently banking while the world rushes around it. -->
    <g transform="translate(600 175)">
      <g class="ship">
        <ellipse class="ship-glow" cx="0" cy="2" rx="35" ry="30" fill="url(#glow)"/>
        <path d="M0 -29L14 5L7 1L0 17L-7 1L-14 5Z"
          fill="#e5ebf4" fill-opacity=".12" stroke="#eef2f8" stroke-width="1.1"/>
        <path d="M0 -23L5 -4L0 0L-5 -4Z" fill="#f3f6fa" fill-opacity=".85" filter="url(#softglow)"/>
        <path d="M-10 7L-29 18L-9 15M10 7L29 18L9 15"
          fill="#ccd6e4" fill-opacity=".09" stroke="#dae2ee" stroke-opacity=".55" stroke-width="1"/>
        <path d="M-4 21L0 31L4 21Z" fill="url(#beam)" class="ship-glow"/>
        <path d="M-24 30H-8M8 30H24" stroke="url(#beam)" stroke-width="1.1"/>
        <circle class="spark" cx="-31" cy="18" r="1.5"/>
        <circle class="spark" cx="31" cy="18" r="1.5" style="animation-delay:-.8s"/>
      </g>
    </g>

    <!-- Minimal HUD corners frame the game scene without adding text or logos. -->
    <path class="hud" d="M18 34V18H42M1158 18H1182V42M18 226V242H42M1158 242H1182V218"/>
    <path d="M36 53H106" stroke="#dfe6f0" stroke-opacity=".13" stroke-width="1"/>
    <path d="M1094 207H1164" stroke="#dfe6f0" stroke-opacity=".13" stroke-width="1"/>
    <g transform="translate(49 49)">
      <circle class="spark" cx="0" cy="0" r="1.4"/>
      <circle class="spark" cx="8" cy="0" r="1.4" style="animation-delay:-.4s"/>
      <circle class="spark" cx="16" cy="0" r="1.4" style="animation-delay:-.8s"/>
    </g>
    <g transform="translate(1080 207)">
      <rect width="78" height="2" rx="1" fill="#dfe6f0" fill-opacity=".1"/>
      <rect width="78" height="2" rx="1" fill="#dfe6f0" fill-opacity=".35">
        <animate attributeName="width" values="8;78;8" dur="1.2s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
