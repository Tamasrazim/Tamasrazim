<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Tamasrazim — animated identity</title><desc id="desc">A black cinematic motion design with animated orbit rings, moving light trails, particles, and the Tamasrazim wordmark.</desc>
