<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="756" viewBox="0 0 1200 756" role="img" aria-labelledby="title desc">
<title id="title">Tamasrazim — animated original identity card</title>
<desc id="desc">A motion-enhanced version of the original black Tamasrazim identity card: registered identity header, constellation stars, scanning light, name, online handle, and active status.</desc>
<defs>
  <linearGradient id="base" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050505"/><stop offset=".52" stop-color="#0b0c10"/><stop offset="1" stop-color="#020202"/></linearGradient>
  <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#f4f4ef" stop-opacity="0"/><stop offset=".5" stop-color="#f4f4ef" stop-opacity=".18"/><stop offset="1" stop-color="#f4f4ef" stop-opacity="0"/></linearGradient>
  <radialGradient id="imageglow"><stop stop-color="#dfe7ff" stop-opacity=".22"/><stop offset="1" stop-color="#dfe7ff" stop-opacity="0"/></radialGradient>
  <filter id="softglow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#fff" stroke-opacity=".055" stroke-width="1"/></pattern>
  <clipPath id="cardclip"><rect x="28" y="28" width="1144" height="700" rx="25"/></clipPath>
  <g id="star"><circle r="2.4" fill="#f4f4ef"/><circle r="7" fill="#f4f4ef" opacity=".12"/></g>
</defs>
<rect width="1200" height="756" fill="#050505"/>
<g clip-path="url(#cardclip)">
  <rect x="28" y="28" width="1144" height="700" rx="25" fill="url(#base)"/>
  <rect x="28" y="28" width="1144" height="700" fill="url(#grid)"/>
  <ellipse cx="850" cy="325" rx="430" ry="300" fill="url(#imageglow)"/>
  <g opacity=".68" stroke="#dbe2f6" stroke-width="1.2" fill="none">
    <path d="M390 245L444 218 501 232 542 201 590 227 631 211 678 249 731 222 779 248 821 215 867 235 910 201 958 230"/>
    <path d="M390 245L421 300 474 326 509 378 566 393 603 443 660 414 705 451 759 420 802 447 849 399 901 414 941 361 988 339"/>
    <path d="M421 300L501 232 509 378 590 227 603 443 678 249 660 414 779 248 759 420 867 235 849 399 958 230 988 339" stroke-opacity=".23"/>
  </g>
  <g fill="#f4f4ef">
    <circle cx="390" cy="245" r="3.2"/><circle cx="444" cy="218" r="2.2"/><circle cx="501" cy="232" r="3.5"/><circle cx="542" cy="201" r="2"/><circle cx="590" cy="227" r="3"/><circle cx="631" cy="211" r="2"/><circle cx="678" cy="249" r="3.5"/><circle cx="731" cy="222" r="2"/><circle cx="779" cy="248" r="3"/><circle cx="821" cy="215" r="2.5"/><circle cx="867" cy="235" r="3.2"/><circle cx="910" cy="201" r="2"/><circle cx="958" cy="230" r="3.3"/>
    <circle cx="421" cy="300" r="2.5"/><circle cx="474" cy="326" r="2"/><circle cx="509" cy="378" r="3.2"/><circle cx="566" cy="393" r="2.1"/><circle cx="603" cy="443" r="3.5"/><circle cx="660" cy="414" r="2.6"/><circle cx="705" cy="451" r="2"/><circle cx="759" cy="420" r="3.2"/><circle cx="802" cy="447" r="2.1"/><circle cx="849" cy="399" r="3.4"/><circle cx="901" cy="414" r="2.3"/><circle cx="941" cy="361" r="3"/><circle cx="988" cy="339" r="2.4"/>
  </g>
  <g filter="url(#softglow)">
    <circle cx="501" cy="232" r="5" fill="#fff"><animate attributeName="opacity" values=".4;1;.45" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="678" cy="249" r="5" fill="#fff"><animate attributeName="opacity" values="1;.3;1" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="603" cy="443" r="5" fill="#fff"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle cx="849" cy="399" r="5" fill="#fff"><animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="28" y="28" width="1144" height="700" fill="url(#scan)" opacity=".55">
    <animate attributeName="y" values="-700;728;-700" dur="7s" repeatCount="indefinite"/>
  </rect>
  <path d="M45 90V45H90 M1110 45H1155V90 M45 666V711H90 M1110 711H1155V666" fill="none" stroke="#f4f4ef" stroke-opacity=".52" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono',monospace" fill="#f4f4ef">
    <text x="78" y="105" font-size="18" letter-spacing="4" opacity=".8">REGISTERED IDENTITY</text>
    <rect x="1060" y="75" width="56" height="38" rx="6" fill="none" stroke="#f4f4ef" stroke-opacity=".55"/>
    <path d="M1071 87H1105M1071 94H1105M1071 101H1093" stroke="#f4f4ef" stroke-opacity=".55"/>
    <text x="78" y="394" font-family="'Unbounded',sans-serif" font-size="47" font-weight="500" letter-spacing="-2">Robiul Rumman Razim</text>
    <path d="M80 421H1120" stroke="#f4f4ef" stroke-opacity=".25"/>
    <text x="80" y="463" font-size="16" letter-spacing="4" opacity=".6">ONLINE HANDLE</text>
    <text x="78" y="535" font-family="'Unbounded',sans-serif" font-size="59" font-weight="700" letter-spacing="1">TAMASRAZIM</text>
    <text x="80" y="574" font-size="14" letter-spacing="2" opacity=".7">RRMZ / TR</text>
    <text x="1120" y="574" font-size="14" letter-spacing="2" text-anchor="end" opacity=".7">PERSONAL WEBSITE</text>
  </g>
  <g transform="translate(80 645)">
    <rect width="105" height="36" rx="4" fill="#f4f4ef" fill-opacity=".055" stroke="#f4f4ef" stroke-opacity=".22"/>
    <circle cx="19" cy="18" r="5" fill="#f4f4ef"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="34" y="23" font-family="monospace" font-size="14" fill="#f4f4ef">ACTIVE</text>
    <text x="1120" y="23" font-family="monospace" font-size="15" fill="#f4f4ef" text-anchor="end" opacity=".7">T/R — 2026</text>
  </g>
  <rect x="28" y="28" width="1144" height="700" rx="25" fill="none" stroke="#fff" stroke-opacity=".22"/>
</g>
<g opacity=".45" fill="#f4f4ef">
  <circle cx="132" cy="175" r="2"><animate attributeName="opacity" values=".15;.8;.15" dur="3s" repeatCount="indefinite"/></circle>
  <circle cx="1065" cy="590" r="2"><animate attributeName="opacity" values=".8;.15;.8" dur="2.3s" repeatCount="indefinite"/></circle>
  <circle cx="105" cy="500" r="1.5"><animate attributeName="opacity" values=".1;.7;.1" dur="2.8s" repeatCount="indefinite"/></circle>
</g>
</svg>