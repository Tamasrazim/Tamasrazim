  <title id="title">Timing Is Design — Motion Study 2.0</title>
  <desc id="desc">A monochrome motion-study footer with an animated scan bar moving across an abstract waveform made from varied vertical strokes. No color accents.</desc>
  <defs>
    <pattern id="signal-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#FFFFFF" stroke-opacity=".055" stroke-width=".7"/></pattern>
    <clipPath id="signal-frame"><rect width="1200" height="220" rx="12"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;fill:#FFFFFF}
    .scan{animation:scan 7s linear infinite}
    .pulse{animation:pulse 2.8s ease-in-out infinite}
    @keyframes scan{from{transform:translateX(0)}to{transform:translateX(660px)}}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:.9}}
    @media(prefers-reduced-motion:reduce){.scan,.pulse{animation:none}.scan{transform:translateX(330px)}.pulse{opacity:.7}}
  </style>
