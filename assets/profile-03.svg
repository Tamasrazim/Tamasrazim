<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">About Me — Design No. 03: Modular Profile</title>
  <desc id="desc">A clean, modular profile layout with an oversized introduction, a restrained three-column information grid, and a closing line. Text fades from 20 percent to full opacity without sliding or bouncing. I'm a developer and computer technology student from Bangladesh. I enjoy building software, creating web experiences, and experimenting with ideas that make technology more useful. I'm interested in how things work at every level—from thoughtful interfaces and animation to the systems underneath them. I learn by building, testing, and improving real projects. This is a small space to share what I'm making, what I'm learning, and where I'm heading next.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;fill:currentColor}
    .sans{font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif;fill:currentColor}
    .meta{font-size:10px;letter-spacing:2.2px;opacity:.48}
    .headline{font-size:48px;font-weight:520;letter-spacing:-2.1px}
    .subhead{font-size:20px;font-weight:400;letter-spacing:-.35px;opacity:.82}
    .label{font-size:10px;letter-spacing:1.7px;opacity:.5}
    .copy{font-size:17px;font-weight:400;letter-spacing:-.15px}
    .number{font-size:11px;letter-spacing:1px;opacity:.4}
    .watermark{font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif;font-size:142px;font-weight:600;letter-spacing:-10px;fill:none;stroke:currentColor;stroke-width:1.2;stroke-opacity:.12}
    .rule{fill:none;stroke:currentColor;stroke-width:1}
    .rule-top{stroke-opacity:.22}
    .rule-soft{stroke-opacity:.12}
    .fade{opacity:.2;animation:arrive .38s ease-out var(--delay) both}
    @keyframes arrive{from{opacity:.2}to{opacity:1}}
    .foot{font-size:10px;letter-spacing:1.5px;opacity:.42}
    @media(prefers-reduced-motion:reduce){.fade{opacity:1;animation:none}}
  </style>

  <path class="rule rule-top" d="M60 43H1140"/>
  <text class="mono meta" x="60" y="27">ABOUT ME</text>
  <text class="mono meta" x="1140" y="27" text-anchor="end">PROFILE / 03</text>

  <g class="fade" style="--delay:.05s">
    <text class="sans headline" x="60" y="111">I'm a developer</text>
    <text class="sans subhead" x="62" y="151">and computer technology student</text>
    <text class="sans subhead" x="62" y="178">from Bangladesh.</text>
  </g>
  <text class="sans watermark fade" x="1136" y="169" text-anchor="end" style="--delay:.25s">03</text>

  <path class="rule rule-soft" d="M60 207H1140M60 398H1140M430 230V376M800 230V376"/>

  <g class="fade" style="--delay:.48s">
    <text class="mono number" x="60" y="234">01</text>
    <text class="mono label" x="92" y="234">BUILD</text>
    <text class="sans copy" x="60" y="269">I enjoy building software,</text>
    <text class="sans copy fade" x="60" y="296" style="--delay:.60s">creating web experiences, and</text>
    <text class="sans copy fade" x="60" y="323" style="--delay:.72s">experimenting with ideas that</text>
    <text class="sans copy fade" x="60" y="350" style="--delay:.84s">make technology more useful.</text>
  </g>

  <g class="fade" style="--delay:.96s">
    <text class="mono number" x="466" y="234">02</text>
    <text class="mono label" x="498" y="234">UNDERSTAND</text>
    <text class="sans copy" x="466" y="269">I'm interested in how things</text>
    <text class="sans copy fade" x="466" y="296" style="--delay:1.08s">work at every level—from</text>
    <text class="sans copy fade" x="466" y="323" style="--delay:1.20s">thoughtful interfaces and</text>
    <text class="sans copy fade" x="466" y="350" style="--delay:1.32s">animation to the systems</text>
    <text class="sans copy fade" x="466" y="377" style="--delay:1.44s">underneath them.</text>
  </g>

  <g class="fade" style="--delay:1.56s">
    <text class="mono number" x="836" y="234">03</text>
    <text class="mono label" x="868" y="234">IMPROVE</text>
    <text class="sans copy" x="836" y="269">I learn by building, testing,</text>
    <text class="sans copy fade" x="836" y="296" style="--delay:1.68s">and improving real projects.</text>
  </g>

  <g class="fade" style="--delay:1.92s">
    <text class="mono label" x="60" y="432">CURRENTLY EXPLORING</text>
    <text class="sans copy" x="60" y="460">This is a small space to share what I'm making, what I'm learning,</text>
    <text class="sans copy fade" x="60" y="484" style="--delay:2.04s">and where I'm heading next.</text>
  </g>

  <text class="mono foot" x="1140" y="460" text-anchor="end">SOFTWARE / WEB / SYSTEMS</text>
</svg>