<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="540" height="360" viewBox="0 0 540 360" role="img" aria-labelledby="title desc">
  <title id="title">Design No. 03 — Working Method</title>
  <desc id="desc">Three working principles: build, understand, improve, arranged as a modular column on white paper.</desc>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;fill:#444444}
    .sans{font-family:Inter,"Segoe UI",Arial,Helvetica,sans-serif;fill:#111111}
    .eyebrow{font-size:10px;letter-spacing:2px;opacity:.62}
    .heading{font-size:25px;font-weight:550;letter-spacing:-.6px}
    .copy{font-size:12.5px;opacity:.82}
    .index{font-size:10px;letter-spacing:1px;opacity:.58}
    .surface{fill:#FFFFFF}.card{fill:#FFFFFF;stroke:#444444;stroke-opacity:.18}.rule{stroke:#444444;stroke-opacity:.2;fill:none}.accent{fill:#111111}
    .signal{stroke-dasharray:4 170;animation:walk 4.5s linear infinite}
    @keyframes walk{from{stroke-dashoffset:174}to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dashoffset:0}}
  </style>
  <rect class="surface" width="540" height="360" rx="12"/>
  <text class="mono eyebrow" x="28" y="32">HOW I WORK / 03 STEPS</text><path class="rule" d="M28 47H512"/>
  <g transform="translate(28 68)"><rect class="card" width="484" height="72" rx="7"/><text class="mono index" x="18" y="24">01</text><text class="sans heading" x="60" y="31">Build</text><text class="sans copy" x="60" y="52">Turn a clear idea into something real.</text><rect class="accent" x="438" y="23" width="18" height="18" rx="4"/><path d="M443 32H451M447 28V36" stroke="#FFFFFF" stroke-width="1.5"/></g>
  <g transform="translate(28 152)"><rect class="card" width="484" height="72" rx="7"/><text class="mono index" x="18" y="24">02</text><text class="sans heading" x="60" y="31">Understand</text><text class="sans copy" x="60" y="52">Trace the parts, interfaces, and systems.</text><circle class="accent" cx="447" cy="32" r="10"/><circle cx="447" cy="32" r="3" fill="#FFFFFF"/></g>
  <g transform="translate(28 236)"><rect class="card" width="484" height="72" rx="7"/><text class="mono index" x="18" y="24">03</text><text class="sans heading" x="60" y="31">Improve</text><text class="sans copy" x="60" y="52">Test carefully. Refine what matters.</text><path d="M436 40L447 20L458 40Z" class="accent"/></g>
  <path d="M28 333H512" stroke="#444444" stroke-opacity=".18"/><path class="signal" d="M28 333H512" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
  <text class="mono eyebrow" x="28" y="350">REPEAT WITH PURPOSE</text>
</svg>