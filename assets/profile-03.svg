  <g class="reveal" style="--delay:2.08s">
    <text class="index" x="92" y="208" text-anchor="end">03</text>
    <text class="label" x="154" y="208">SYSTEMS &amp; DESIGN</text>
    <text class="body" x="154" y="233">I&apos;m interested in how things work at every level—from</text>
  </g>
  <text class="body reveal" x="154" y="257" style="--delay:2.30s">thoughtful interfaces and animation to the systems underneath them.</text>

  <g class="reveal" style="--delay:3.14s">
    <text class="index" x="92" y="287" text-anchor="end">04</text>
    <text class="label" x="154" y="287">APPROACH</text>
    <text class="body" x="154" y="312">I learn by building, testing, and improving real projects.</text>
  </g>

  <g class="reveal" style="--delay:4.02s">
