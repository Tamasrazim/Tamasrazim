<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Think in Systems — Profile Design 3.0</title>
  <desc id="desc">A bright monochrome editorial canvas with oversized typography and an orthogonal system map connecting four practical stages: input, frame, build, and verify.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#111111" stroke-opacity=".055" stroke-width=".65"/></pattern>
    <clipPath id="frame"><rect width="1200" height="260" rx="10"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;fill:#111111}
    .display{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-weight:780;letter-spacing:-3px;fill:#111111}
    .label{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;font-size:9px;letter-spacing:1.4px;fill:#FFFFFF}
    .route{fill:none;stroke:#777777;stroke-width:1.4;stroke-linejoin:round}
    .signal{stroke-dasharray:12 380;animation:trace 5.5s linear infinite}
    .blink{animation:blink 2.6s steps(2,end) infinite}
    @keyframes trace{from{stroke-dashoffset:392}to{stroke-dashoffset:0}}
    @keyframes blink{0%,40%{opacity:.35}50%,100%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.signal,.blink{animation:none}.signal{stroke-dashoffset:0}.blink{opacity:1}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="260" fill="#FFFFFF"/>
    <rect width="1200" height="260" fill="url(#grid)"/>
    <path d="M0 44H1200M0 222H1200M738 0V260" stroke="#111111" stroke-opacity=".18"/>
    <path d="M32 0V260M1168 0V260" stroke="#111111" stroke-opacity=".12"/>
    <text class="mono" x="36" y="27" font-size="9.5" letter-spacing="2">TAMASRAZIM / PROFILE STUDY</text>
    <text class="mono" x="1163" y="27" text-anchor="end" font-size="9.5" letter-spacing="1.8">EDITION 03.0</text>
    <text class="display" x="34" y="112" font-size="65">THINK IN</text>
    <text class="display" x="31" y="176" font-size="65">SYSTEMS.</text>
    <text class="mono" x="38" y="199" font-size="10" letter-spacing="1.25" opacity=".72">OBSERVE → BUILD → TEST → REFINE</text>
    <path d="M36 235H680" stroke="#111111" stroke-opacity=".25"/>
    <text class="mono" x="38" y="250" font-size="8.5" letter-spacing="1.5" opacity=".55">MAKE THE PARTS WORK TOGETHER.</text>
    <g>
      <text class="mono" x="774" y="65" font-size="8.5" letter-spacing="1.5" opacity=".62">A SIMPLE SYSTEM MAP</text>
      <path class="route" d="M807 105H898V151H986V105H1092V164H1138"/>
      <path class="signal" d="M807 105H898V151H986V105H1092V164H1138" fill="none" stroke="#111111" stroke-width="2.4" stroke-linecap="round"/>
      <g><rect x="783" y="86" width="48" height="38" fill="#111111"/><text class="label" x="807" y="108" text-anchor="middle">IN</text></g>
      <g><rect x="876" y="132" width="44" height="38" fill="#111111"/><text class="label" x="898" y="154" text-anchor="middle">MAP</text></g>
      <g><rect x="964" y="86" width="44" height="38" fill="#111111"/><text class="label" x="986" y="108" text-anchor="middle">DO</text></g>
      <g><rect x="1070" y="145" width="44" height="38" fill="#111111"/><text class="label" x="1092" y="167" text-anchor="middle">QA</text></g>
      <circle class="blink" cx="1138" cy="164" r="4" fill="#111111"/>
      <text class="mono" x="783" y="137" font-size="8" letter-spacing="1.1" opacity=".62">INPUT</text>
      <text class="mono" x="876" y="184" font-size="8" letter-spacing="1.1" opacity=".62">FRAME</text>
      <text class="mono" x="964" y="137" font-size="8" letter-spacing="1.1" opacity=".62">BUILD</text>
      <text class="mono" x="1070" y="197" font-size="8" letter-spacing="1.1" opacity=".62">VERIFY</text>
      <path d="M774 211H1150" stroke="#111111" stroke-opacity=".18"/>
      <text class="mono" x="774" y="229" font-size="8.5" letter-spacing="1.2" opacity=".62">LESS NOISE / MORE CONNECTION</text>
    </g>
  </g>
</svg>