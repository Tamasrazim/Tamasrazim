<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Ideas into Systems</title>
  <desc id="desc">A clean, warm-toned technical diagram showing a path from an idea through a model to a working system, with a moving signal tracing the connections.</desc>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#24433C" stroke-opacity=".065" stroke-width=".75"/>
    </pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F5F3EB"/>
      <stop offset="1" stop-color="#E9EDE4"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#E16E50" stop-opacity="0"/>
      <stop offset=".5" stop-color="#E16E50"/>
      <stop offset="1" stop-color="#E16E50" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hero-clip"><rect width="1200" height="230" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="230" fill="url(#surface)"/>
    <rect width="1200" height="230" fill="url(#paper-grid)"/>
    <rect x="0" y="0" width="10" height="230" fill="#E16E50"/>
    <text x="54" y="39" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="2.5" fill="#31544A" opacity=".7">NOTES ON MAKING</text>
    <text x="54" y="101" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="45" font-weight="600" letter-spacing="-1.7" fill="#173A32">Ideas into systems.</text>
    <text x="56" y="133" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="15" fill="#31544A" opacity=".82">Understand the parts. Build the whole.</text>
    <path d="M56 164H440" stroke="#31544A" stroke-opacity=".25" stroke-width="1"/>
    <text x="56" y="190" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.8" fill="#31544A" opacity=".65">THINK</text>
    <path d="M107 186H151" stroke="#31544A" stroke-opacity=".35"/>
    <text x="164" y="190" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.8" fill="#31544A" opacity=".65">BUILD</text>
    <path d="M211 186H255" stroke="#31544A" stroke-opacity=".35"/>
    <text x="268" y="190" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.8" fill="#31544A" opacity=".65">REFINE</text>
    <g transform="translate(530 20)">
      <rect x="0" y="0" width="610" height="190" rx="9" fill="#F8F7F1" fill-opacity=".63" stroke="#31544A" stroke-opacity=".19"/>
      <g stroke="#31544A" stroke-opacity=".10">
        <path d="M30 32H580M30 64H580M30 96H580M30 128H580M30 160H580"/>
        <path d="M62 18V172M126 18V172M190 18V172M254 18V172M318 18V172M382 18V172M446 18V172M510 18V172M574 18V172"/>
      </g>
      <path d="M54 111H151L192 76H294L344 111H441L477 61H554" fill="none" stroke="#31544A" stroke-opacity=".72" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M54 111H151L192 76H294L344 111H441L477 61H554" fill="none" stroke="url(#signal)" stroke-width="7" stroke-linecap="round" stroke-dasharray="48 520">
        <animate attributeName="stroke-dashoffset" values="568;0" dur="4.8s" repeatCount="indefinite"/>
      </path>
      <g fill="#F8F7F1" stroke="#31544A" stroke-width="1.5">
        <rect x="42" y="99" width="24" height="24" rx="4"/>
        <circle cx="192" cy="76" r="7"/>
        <rect x="284" y="66" width="20" height="20" rx="3"/>
        <circle cx="441" cy="111" r="7"/>
        <rect x="544" y="51" width="20" height="20" rx="3"/>
      </g>
      <g fill="#E16E50">
        <circle cx="54" cy="111" r="3"/>
        <circle cx="192" cy="76" r="2.2"/>
        <circle cx="441" cy="111" r="2.2"/>
        <circle cx="554" cy="61" r="2.2"/>
      </g>
      <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="9" fill="#31544A" opacity=".7" letter-spacing="1.3">
        <text x="40" y="146">INPUT</text><text x="171" y="55">MODEL</text><text x="314" y="146">TEST</text><text x="517" y="92">OUTPUT</text>
      </g>
    </g>
  </g>
</svg>