<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">Ideas into Systems</title>
  <desc id="desc">A monochrome technical banner. A connected route passes through input, model, test, and output, representing a practical approach to software and systems.</desc>
  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#000000" stroke-opacity=".065" stroke-width=".75"/></pattern>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4F4F4"/></linearGradient>
    <clipPath id="frame"><rect width="1200" height="230" rx="14"/></clipPath>
  </defs>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace;fill:#3A3A3A}
    .signal{stroke-dasharray:38 470;animation:trace 5s linear infinite}
    @keyframes trace{from{stroke-dashoffset:508}to{stroke-dashoffset:0}}
    @media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dashoffset:0}}
  </style>
  <g clip-path="url(#frame)">
    <rect width="1200" height="230" fill="url(#surface)"/><rect width="1200" height="230" fill="url(#paper-grid)"/><rect width="9" height="230" fill="#111111"/>
    <text class="mono" x="54" y="38" font-size="10" letter-spacing="2.5" opacity=".72">FIELD NOTES / SOFTWARE &amp; SYSTEMS</text>
    <text x="52" y="101" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="47" font-weight="600" letter-spacing="-1.8" fill="#101010">Ideas into systems.</text>
    <text x="56" y="133" font-family="Inter,'Segoe UI',Arial,sans-serif" font-size="15" fill="#3A3A3A" opacity=".84">Understand the parts. Build the whole.</text>
    <path d="M56 164H444" stroke="#3A3A3A" stroke-opacity=".24"/>
    <text class="mono" x="56" y="190" font-size="10" letter-spacing="1.8" opacity=".76">THINK</text><path d="M107 186H151" stroke="#3A3A3A" stroke-opacity=".36"/>
    <text class="mono" x="164" y="190" font-size="10" letter-spacing="1.8" opacity=".76">BUILD</text><path d="M211 186H255" stroke="#3A3A3A" stroke-opacity=".36"/>
    <text class="mono" x="268" y="190" font-size="10" letter-spacing="1.8" opacity=".76">REFINE</text>
    <g transform="translate(530 20)">
      <rect width="610" height="190" rx="9" fill="#FFFFFF" fill-opacity=".72" stroke="#3A3A3A" stroke-opacity=".2"/>
      <g stroke="#3A3A3A" stroke-opacity=".10"><path d="M30 32H580M30 64H580M30 96H580M30 128H580M30 160H580"/><path d="M62 18V172M126 18V172M190 18V172M254 18V172M318 18V172M382 18V172M446 18V172M510 18V172M574 18V172"/></g>
      <path d="M54 111H151L192 76H294L344 111H441L477 61H554" fill="none" stroke="#3A3A3A" stroke-opacity=".56" stroke-width="1.5" stroke-linejoin="round"/>
      <path class="signal" d="M54 111H151L192 76H294L344 111H441L477 61H554" fill="none" stroke="#111111" stroke-width="3.2" stroke-linecap="round"/>
      <g fill="#FFFFFF" stroke="#3A3A3A" stroke-width="1.5"><rect x="42" y="99" width="24" height="24" rx="4"/><circle cx="192" cy="76" r="7"/><rect x="284" y="66" width="20" height="20" rx="3"/><circle cx="441" cy="111" r="7"/><rect x="544" y="51" width="20" height="20" rx="3"/></g>
      <g fill="#111111"><circle cx="54" cy="111" r="3"/><circle cx="192" cy="76" r="2.2"/><circle cx="441" cy="111" r="2.2"/><circle cx="554" cy="61" r="2.2"/></g>
      <g class="mono" font-size="9" opacity=".78" letter-spacing="1.2"><text x="40" y="146">INPUT</text><text x="171" y="55">MODEL</text><text x="314" y="146">TEST</text><text x="517" y="92">OUTPUT</text></g>
    </g>
  </g>
</svg>